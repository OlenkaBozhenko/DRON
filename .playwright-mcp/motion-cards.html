<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>
  body{ margin:0; background:#fff; }
  .c{ width:560px; height:315px; display:grid; place-items:center; margin:0 0 8px;
      background: linear-gradient(135deg, #ECE9E4 0%, #E7F0D2 55%, #B7DA7C 100%); }
  .c svg{ width:140px; height:140px; fill:none; stroke:#1A1A1A; stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round; }
</style></head><body>
<!-- motion-about: an arrow with its trail -->
<div class="c" id="motion-about"><svg viewBox="0 0 24 24"><path d="M3 8h4M3 16h4M2 12h3M9 12h11M15 7l5 5-5 5"/></svg></div>
<!-- motion-scale: a stopwatch -->
<div class="c" id="motion-scale"><svg viewBox="0 0 24 24"><circle cx="12" cy="13.5" r="7"/><path d="M12 13.5V10M10 3h4M12 3v3.5M18 7l1.5-1.5"/></svg></div>
<!-- motion-micro: a pointer and its click -->
<div class="c" id="motion-micro"><svg viewBox="0 0 24 24"><path d="M9 8l10 4.2-4.3 1.3 2.8 4.6-2 1.2-2.8-4.6L9.5 18z"/><path d="M5 5.5L3.5 4M4.5 9H2.5M8 4.5V2.5"/></svg></div>
<!-- motion-states: a window rising into place -->
<div class="c" id="motion-states"><svg viewBox="0 0 24 24"><rect x="4" y="10" width="16" height="10.5" rx="2.5"/><path d="M8 14h8M8 17h5M12 7.5V2.5M9.5 5L12 2.5 14.5 5"/></svg></div>
<!-- motion-loops: a loop that repeats -->
<div class="c" id="motion-loops"><svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.34-5.66"/><path d="M20 3.8v4.6h-4.6"/></svg></div>
<!-- motion-access: the accessibility figure -->
<div class="c" id="motion-access"><svg viewBox="0 0 24 24"><circle cx="12" cy="4.8" r="1.8"/><path d="M5 9l7 1.5L19 9M12 10.5V15M12 15l-3 6M12 15l3 6"/></svg></div>
<!-- motion-decisions: a fork, one way chosen -->
<div class="c" id="motion-decisions"><svg viewBox="0 0 24 24"><path d="M12 21v-8M12 13L6 7M12 13l6-6M6 11V7h4M14 7h4v4"/></svg></div>
</body></html>
