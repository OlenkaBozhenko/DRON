<!doctype html>
<meta charset="utf-8">
<title>measure</title>
<iframe id="a" src="/wireframes/listings.html" style="width:375px;height:900px;border:0"></iframe>
<iframe id="b" src="/wireframes/operator-listings.html" style="width:375px;height:900px;border:0"></iframe>
<pre id="out">pending</pre>
<script>
function read(f, label){
  var d = f.contentDocument;
  d.body.classList.add('wf-hide-anno');
  var fr = d.querySelector('.wf-frame').getBoundingClientRect();
  var nav = d.querySelector('.dr-groups');
  var tabs = [].slice.call(d.querySelectorAll('.dr-grouptab'));
  var cur = d.querySelector('.dr-grouptab[aria-current="true"]');
  var rel = function(e){ var b = e.getBoundingClientRect();
    return {x:+(b.x-fr.x).toFixed(2), y:+(b.y-fr.y).toFixed(2), w:+b.width.toFixed(2), h:+b.height.toFixed(2)}; };
  // natural text width of each label
  var nat = tabs.map(function(t){
    var r = d.createRange(); r.selectNodeContents(t);
    return {text:t.textContent.trim(), textW:+r.getBoundingClientRect().width.toFixed(2), box:rel(t)};
  });
  var cs = getComputedStyle(nav);
  return {
    page: label,
    frameW: +fr.width.toFixed(2),
    parent: nav.parentElement.tagName.toLowerCase() + '.' + (nav.parentElement.className||'').split(' ')[0],
    nav: Object.assign(rel(nav), {padInline: cs.paddingLeft + ' / ' + cs.paddingRight, scrollW: nav.scrollWidth, clientW: nav.clientWidth, scrolls: nav.scrollWidth > nav.clientWidth + 1}),
    gapAboveNav: (function(){ var p = nav.previousElementSibling; if(!p) return null;
      var pb = p.getBoundingClientRect(), nb = nav.getBoundingClientRect(); return +(nb.top - pb.bottom).toFixed(2); })(),
    currentUnderline: cur ? {label: cur.textContent.trim(), ruleW: rel(cur).w, textW: nat.filter(function(n){return n.text===cur.textContent.trim();})[0].textW} : null,
    tabs: nat
  };
}
window.addEventListener('load', function(){
  setTimeout(function(){
    var r = [read(document.getElementById('a'),'listings (client)'),
             read(document.getElementById('b'),'operator-listings')];
    document.getElementById('out').textContent = JSON.stringify(r, null, 1);
  }, 600);
});
</script>
