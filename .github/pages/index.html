<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>DRON — Documents</title>
  <style>
    :root { color-scheme: light dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: -apple-system, "SF Pro Text", "Segoe UI", system-ui, sans-serif;
      background: #0b0e14;
      color: #e6e9ef;
    }
    main { width: min(560px, 90vw); padding: 48px 0; }
    .brand { font-size: 13px; letter-spacing: .28em; text-transform: uppercase; color: #6b7280; margin: 0 0 8px; }
    h1 { font-size: 28px; font-weight: 600; margin: 0 0 32px; }
    ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
    a {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 18px 20px;
      border: 1px solid #1f2633;
      border-radius: 14px;
      background: #11161f;
      color: #e6e9ef;
      text-decoration: none;
      font-size: 16px;
      transition: border-color .15s, transform .15s;
    }
    a:hover { border-color: #3b82f6; transform: translateY(-1px); }
    a span { color: #6b7280; font-size: 13px; }
  </style>
</head>

  <main>
    <p class="brand">DRON</p>

  </main>
