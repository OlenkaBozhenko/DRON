name: Sync HTML to GitHub Pages

# Copies the rendered HTML from master to the gh-pages branch on every push.
# Source .md files stay on master and are never published.

on:
  push:
    branches: [master]
    paths:
      - '*.html'
      - 'wireframes/**'
      - 'concept/**'
      - 'assets/**'
      - 'ui/*.html'
      - 'ui/*.css'
      - 'ui/*.js'
      - 'design-system/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-sync
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout master
        uses: actions/checkout@v4

      - name: Assemble publish directory
        run: |
          mkdir -p _site
          cp ia.html research.html target-audience.html ux-research.html tone-of-voice.html design-system.html _site/
          # The index lives at the repo root, not in .github/pages, so that a
          # local `python -m http.server` opens it instead of a directory
          # listing of .git/ and .claude/. One file serves both.
          cp index.html _site/index.html
          # The index links the component kit, so the kit has to ship or the
          # link 404s on the live site while working locally. The stylesheet
          # ships with it: the painted wireframes load ../ui/kit.css, so an
          # html-only copy leaves order-history, tracking and delivery
          # unpainted on the published site while they look right locally.
          # AND THE SCRIPT SHIPS WITH BOTH (2026-08-20). ui/kit.js is the kit's
          # one behaviour — the picker drawer and the onscreen keyboard — and 39
          # published wireframes link it. Copying only *.html and *.css left it
          # 404 on gh-pages, so every drawer and dropdown on the live prototype
          # was a dead tap while opening fine locally: the flow stopped at the
          # first picker. A glob per extension is what let one file fall out, so
          # this line names the three the kit is made of.
          mkdir -p _site/ui
          cp ui/*.html ui/*.css ui/*.js _site/ui/
          # Publish the clickable wireframe prototype (HTML pages + shared CSS/JS).
          # The .md sources stay on master and are not published.
          mkdir -p _site/wireframes
          cp wireframes/*.html _site/wireframes/
          cp wireframes/_wireframe.css wireframes/_wf-shell.js _site/wireframes/
          # THE TOKEN + COMPONENT LAYER, which every page has linked since the
          # 2026-09-24 move off ui/kit.css. Leaving it out is how the live site
          # came up on 2026-10-10 with only the prototype chrome styled: every
          # product rule 404'd, so each SVG drew at its intrinsic size and the
          # status bar filled the screen. Local looked right the whole time,
          # because a local server hands over the whole repo.
          # Since 2026-10-14 the layer is ONE PACKAGE, design-system/, reached
          # through one entry point, design-system/index.css. Its CSS ships with
          # its folder structure intact, because index.css imports by relative
          # path; the .md notes beside it stay on master.
          mkdir -p _site/design-system/components
          cp design-system/*.css _site/design-system/
          cp design-system/components/*.css _site/design-system/components/
          # The component docs: the generated pages and their chrome. src/ and
          # build.py are the sources and stay on master, like every .md.
          mkdir -p _site/design-system/docs
          cp design-system/docs/*.html design-system/docs/docs.css design-system/docs/docs.js _site/design-system/docs/
          # Publish the concept design-direction pages (HTML only).
          # The .md sources stay on master and are not published.
          mkdir -p _site/concept
          cp concept/*.html _site/concept/
          # Publish the imagery set (drones, people, scenes). The concept pages and
          # the wireframes reference these by root-relative path, so the folder has
          # to exist on gh-pages verbatim or every <img> 404s.
          # The reference screenshots research.html draws. research/ is a source
          # folder and stays unpublished, but these eight PNGs are rendered by a
          # published page, so the page shipped with eight broken images until
          # the self-check below started looking. Only the screens ship, not the
          # .md notes beside them.
          mkdir -p _site/research/screens
          cp research/screens/*.png _site/research/screens/
          cp -r assets _site/assets

      - name: Cache-bust shared assets
        run: |
          # GitHub Pages serves everything with Cache-Control: max-age=600 and no
          # way to override headers, so browsers (especially mobile) keep stale
          # copies of the shared shell/CSS. Stamp the published HTML's references
          # to _wf-shell.js / _wireframe.css with the commit SHA so a shell change
          # produces a new asset URL and phones refetch it automatically.
          # Only the published (gh-pages) copies are touched — master HTML stays clean.
          STAMP="${GITHUB_SHA::8}"
          find _site/wireframes -name '*.html' -print0 | xargs -0 sed -i \
            -e "s#\"_wireframe.css\"#\"_wireframe.css?v=${STAMP}\"#g" \
            -e "s#\"_wf-shell.js\"#\"_wf-shell.js?v=${STAMP}\"#g" \
            -e "s#\"../design-system/index.css\"#\"../design-system/index.css?v=${STAMP}\"#g"
          echo "Stamped shared-asset URLs with v=${STAMP}"

      - name: Fail if a published page links something that is not published
        run: |
          # THE GUARD THIS WORKFLOW HAS NEEDED THREE TIMES. The publish step
          # names its files one by one, which is correct - the .md sources must
          # not ship - but it means the list goes stale every time the build
          # changes shape, and nothing notices. It has now happened three times:
          # ui/kit.css (the painted screens came up unpainted), ui/kit.js (every
          # drawer on the live prototype was a dead tap), and on 2026-10-10 the
          # whole token + component layer. Each one worked locally the entire
          # time, because a local server hands over the repo and gh-pages hands
          # over this folder. So from here the build CHECKS ITSELF: every local
          # href and src in every published page must resolve inside _site.
          python3 - <<'CHECK'
          import os, re, sys
          from urllib.parse import urlsplit, unquote
          ROOT = '_site'
          Q = chr(34) + chr(39)          # the two quote characters
          REF = re.compile('(?:href|src)=[' + Q + ']([^' + Q + ']+)')
          missing, notes, checked = [], [], 0
          for dirpath, _, files in os.walk(ROOT):
              for f in files:
                  if not f.endswith('.html'):
                      continue
                  page = os.path.join(dirpath, f)
                  with open(page, encoding='utf-8', errors='replace') as fh:
                      html = fh.read()
                  for raw in REF.findall(html):
                      if raw.startswith(('http://', 'https://', '//', 'mailto:', 'tel:', 'data:', '#')):
                          continue
                      path = unquote(urlsplit(raw).path)
                      if not path:
                          continue
                      target = (os.path.join(ROOT, path.lstrip('/')) if path.startswith('/')
                                else os.path.normpath(os.path.join(dirpath, path)))
                      checked += 1
                      if os.path.exists(target):
                          continue
                      # A .md link is EXPECTED to be missing: the sources stay on
                      # master by design. It is still a dead link for a visitor, so
                      # it is listed - but it must not block a deploy.
                      (notes if target.endswith('.md') else missing).append(
                          (os.path.relpath(page, ROOT), raw))
          print('checked %d local references across the published site' % checked)
          if missing:
              seen = sorted({m[1] for m in missing})
              print('')
              print('%d reference(s) point at something that is NOT published:' % len(missing))
              for ref in seen:
                  pages = [p for p, r in missing if r == ref]
                  print('  %-44s  %d page(s), e.g. %s' % (ref, len(pages), pages[0]))
              print('')
              print('Add the file to the Assemble publish directory step, or stop linking it.')
              sys.exit(1)
          if notes:
              print('')
              print('%d link(s) point at an .md source, which is never published by design:' % len(notes))
              for page, ref in sorted(set(notes)):
                  print('  %-44s  on %s' % (ref, page))
              print('Not fatal. Point them at the GitHub blob URL if you want them to work.')
          print('')
          print('every local reference that should resolve, resolves inside _site')
          CHECK
      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./_site
          force_orphan: true
          commit_message: "auto: sync HTML to gh-pages"
