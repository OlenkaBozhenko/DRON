name: Sync HTML to GitHub Pages

# Copies the rendered HTML from master to the gh-pages branch on every push.
# Source .md files stay on master and are never published.

on:
  push:
    branches: [master]
    paths:
      - '*.html'
      - 'wireframes/**'
      - '.github/pages/index.html'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-sync
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout master
        uses: actions/checkout@v4

      - name: Assemble publish directory
        run: |
          mkdir -p _site
          cp ia.html research.html target-audience.html ux-research.html _site/
          cp .github/pages/index.html _site/index.html
          # Publish the clickable wireframe prototype (HTML pages + shared CSS/JS).
          # The .md sources stay on master and are not published.
          mkdir -p _site/wireframes
          cp wireframes/*.html _site/wireframes/
          cp wireframes/_wireframe.css wireframes/_wf-shell.js _site/wireframes/

      - name: Cache-bust shared assets
        run: |
          # GitHub Pages serves everything with Cache-Control: max-age=600 and no
          # way to override headers, so browsers (especially mobile) keep stale
          # copies of the shared shell/CSS. Stamp the published HTML's references
          # to _wf-shell.js / _wireframe.css with the commit SHA so a shell change
          # produces a new asset URL and phones refetch it automatically.
          # Only the published (gh-pages) copies are touched — master HTML stays clean.
          STAMP="${GITHUB_SHA::8}"
          find _site/wireframes -name '*.html' -print0 | xargs -0 sed -i \
            -e "s#\"_wireframe.css\"#\"_wireframe.css?v=${STAMP}\"#g" \
            -e "s#\"_wf-shell.js\"#\"_wf-shell.js?v=${STAMP}\"#g"
          echo "Stamped shared-asset URLs with v=${STAMP}"

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./_site
          force_orphan: true
          commit_message: "auto: sync HTML to gh-pages"
