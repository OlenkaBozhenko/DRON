<!doctype html>
<html lang="en" data-wf-viewport="desktop">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DRON desktop · Profile setup · success (base)</title>
<meta name="description" content="Desktop twin of wireframes/operator-profile-setup.html.">
<!-- DESKTOP TWIN of ../operator-profile-setup.html (2026-10-18), group 6 · Operator: getting in and jobs.
     Signed-out step: a centred window over the map, the header holds the brand and the theme only. -->
<link rel="stylesheet" href="../../design-system/index.css">
</head>
<body class="dr">
<div class="wf-frame dr dr-screen dr-screen--fluid dr-desk dr-desk--jobs">
  <div class="dr-mapground" role="img" aria-label="Live map of Kyiv, 128 drones in the air"><span class="dr-mapground__drone" style="left:31%;top:34%"></span><span class="dr-mapground__drone" style="left:44%;top:58%"></span><span class="dr-mapground__drone" style="left:63%;top:30%"></span><span class="dr-mapground__drone" style="left:70%;top:66%"></span><span class="dr-mapground__drone" style="left:60%;top:82%"></span><span class="dr-mapground__drone" style="left:38%;top:76%"></span><span class="dr-mapground__drone" style="left:78%;top:44%"></span><span class="dr-mapground__drone" style="left:24%;top:60%"></span><span class="dr-mapground__drone" style="left:58%;top:48%"></span></div>
  <div class="dr-veil" aria-hidden="true"></div>
  <header class="dr-whead">
    <a class="dr-brandlink" href="../../research.html" aria-label="DRON project"><span class="dr-brand" aria-hidden="true"></span></a>
    <div class="dr-whead__end">
      <button class="dr-iconbtn dr-material" type="button" data-theme-cycle aria-label="Switch the theme"><svg class="dr-ic dr-iconbtn__moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19.5 14.5A8 8 0 0 1 9.5 4.5a8 8 0 1 0 10 10z"/></svg><svg class="dr-ic dr-iconbtn__sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M5.6 18.4L7 17M17 7l1.4-1.4"/></svg></button>
    </div>
  </header>
  <div class="dr-dim" aria-hidden="true"></div>
  <main class="dr-window dr-material" aria-labelledby="win-title">
    <div class="dr-window__head"><a class="dr-iconbtn dr-material" href="operator-verification.html" aria-label="Back to Verification"><svg class="dr-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></a><h1 class="dr-window__title" id="win-title">Profile setup</h1></div>
    <div class="dr-scroll">
      <form class="dr-stack dr-stack--zones" aria-label="Profile setup" action="#">
        <div class="dr-upload dr-upload--card" role="button" tabindex="0" aria-labelledby="profile-photo-title">
          <svg class="dr-ic dr-ic--32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 13v5a1.6 1.6 0 0 0 1.6 1.6h8.8A1.6 1.6 0 0 0 18 18v-5"/><path d="M12 4.2v10.3"/><path d="M8.4 7.8L12 4.2l3.6 3.6"/></svg>
          <span class="dr-upload__action" id="profile-photo-title">Add photo</span>
        </div>
        <div class="dr-rows">
          <div class="dr-field">
            <label class="dr-field__label" for="nm">Display name</label>
            <span class="dr-field__group"><input class="dr-field__input" id="nm" placeholder="e.g. Andriy K."></span>
          </div>
          <div class="dr-field dr-field--area">
            <label class="dr-field__label" for="bio">Short bio</label>
            <textarea class="dr-field__input" id="bio" placeholder="Certified operator since 2023. Fast, careful deliveries across Kyiv…"></textarea>
            <span class="dr-field__hint">1–2 lines clients see. Your experience and the area you cover.</span>
          </div>
        </div>
        <fieldset class="dr-zone" aria-labelledby="spec-title">
          <p class="dr-zone__title" id="spec-title">Service specializations</p>
          <ul class="dr-picks">
            <li><label class="dr-pick">
              <span class="dr-box dr-box--check" aria-hidden="true"><svg class="dr-ic dr-ic--14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 6"/></svg></span>
              <span class="dr-pick__label">Delivery</span>
              <input type="checkbox" name="specialization" value="delivery" checked class="sr-only">
            </label></li>
            <li><label class="dr-pick">
              <span class="dr-box dr-box--check" aria-hidden="true"><svg class="dr-ic dr-ic--14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 6"/></svg></span>
              <span class="dr-pick__label">Photo &amp; video</span>
              <input type="checkbox" name="specialization" value="aerial" checked class="sr-only">
            </label></li>
            <li><label class="dr-pick">
              <span class="dr-box dr-box--check" aria-hidden="true"><svg class="dr-ic dr-ic--14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 6"/></svg></span>
              <span class="dr-pick__label">Inspection</span>
              <input type="checkbox" name="specialization" value="inspection" class="sr-only">
            </label></li>
          </ul>
        </fieldset>
      </form>
    </div>
    <div class="dr-foot"><div class="dr-acts">
      <a class="dr-btn dr-btn--primary dr-btn--block" href="operator-listings.html">Save &amp; go live</a>
    </div></div>
  </main>
</div>
<a class="wf-twin" href="../operator-profile-setup.html">Phone view</a>
<script src="../../ui/kit.js"></script>
</body>
</html>
