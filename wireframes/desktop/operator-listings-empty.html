<!doctype html>
<html lang="en" data-wf-viewport="desktop">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DRON desktop · Operator home + status toggle · empty</title>
<meta name="description" content="Desktop twin of wireframes/operator-listings-empty.html.">
<!-- DESKTOP TWIN of ../operator-listings-empty.html (2026-10-18), group 6 · Operator: getting in and jobs.
     Jobs tab root, the operator's home: the map with the open jobs as drone dots, the job list in a panel at the left, the availability at the right. State: empty, offline, so no job on the map. -->
<link rel="stylesheet" href="../../design-system/index.css">
<link rel="stylesheet" href="_desktop.css">
<link rel="stylesheet" href="_desktop-op-jobs.css">
</head>
<body class="dr">
<div class="wf-frame dr dr-screen dr-screen--fluid dk">
  <div class="dr-mapground" role="img" aria-label="Live map of Kyiv"></div>
  <div class="dk-veil" aria-hidden="true"></div>
  <header class="dr-whead">
    <span class="dr-brand" role="img" aria-label="DRON"></span>
    <nav class="dr-whead__nav dr-material" aria-label="Primary">
      <a class="dr-whead__link" href="operator-listings.html" aria-current="page">Jobs</a>
      <a class="dr-whead__link" href="wallet.html">Earnings</a>
      <a class="dr-whead__link" href="ratings.html">Ratings</a>
      <a class="dr-whead__link" href="operator-account.html">Account</a>
    </nav>
    <div class="dr-whead__end">
      <button class="dr-iconbtn dr-material" type="button" data-theme-cycle aria-label="Switch the theme"><svg class="dr-ic dr-iconbtn__moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19.5 14.5A8 8 0 0 1 9.5 4.5a8 8 0 1 0 10 10z"/></svg><svg class="dr-ic dr-iconbtn__sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M5.6 18.4L7 17M17 7l1.4-1.4"/></svg></button>
      <a class="dr-iconbtn dr-material" href="operator-notifications.html" aria-label="Notifications"><svg class="dr-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 16V11a6 6 0 0 1 12 0v5l1.5 2h-15z"/><path d="M10 20a2 2 0 0 0 4 0"/></svg></a>
      <a class="dr-profilechip dr-material" href="operator-account.html"><img src="../../assets/people/thumbs/person-operator-ivan.png" alt=""><span class="dr-profilechip__text">Ivan K.<span class="dr-profilechip__place">Operator · Kyiv</span></span></a>
    </div>
  </header>
  <main class="dk-home">
    <h1 class="sr-only">Jobs</h1>
    <section class="dk-jobs dr-material" aria-label="Jobs">
      <nav class="dr-groups" aria-label="Job groups">
        <a class="dr-grouptab" href="#no-offers" aria-current="true">Incoming <span class="dr-grouptab__count">0</span></a>
        <a class="dr-grouptab" href="#no-offers">Active <span class="dr-grouptab__count">0</span></a>
      </nav>
      <section id="no-offers" aria-label="No offers">
        <div class="dr-msg" role="status">
          <span class="dr-mark" aria-hidden="true"><svg class="dr-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><path d="M6 6l12 12"/></svg></span>
          <span class="dr-msg__title">No jobs while you're offline</span>
          <p class="dr-msg__body">Go Available to start receiving pre-qualified jobs near you.</p>
          <div class="dr-msg__actions">
            <a class="dr-btn dr-btn--primary" href="operator-listings.html">Go Available</a>
          </div>
        </div>
      </section>
    </section>
    <aside class="dk-side" aria-label="Availability status">
      <div class="dr-tally dr-material dk-status-card">
        <span class="dr-chip dr-chip--sm dr-avail-badge" data-avail-badge data-state="offline"><span class="dr-avail-badge__dot" aria-hidden="true"></span><span data-avail-word>Offline</span></span>
        <p class="dr-avail">
          <span class="dr-avail__dot" aria-hidden="true"></span>
          <b class="dr-avail__state">You are Offline</b><span class="dr-avail__note">· no jobs while offline</span>
        </p>
        <div class="dr-rows">
          <button class="dr-field dr-field--action" type="button" aria-haspopup="dialog" aria-expanded="false" aria-controls="sheet-avail">
            <span class="dr-field__label">Availability</span>
            <span class="dr-field__value">Offline</span>
            <span class="dr-field__chev"><svg class="dr-ic dr-ic--16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg></span>
          </button>
        </div>
      </div>
    </aside>
  </main>
  <div class="dr-scrim dr-scrim--picker" data-scrim hidden></div>
  <section class="dr-sheet dr-sheet--picker" id="sheet-avail" role="dialog" aria-modal="true" aria-labelledby="sheet-avail-title" hidden>
    <span class="dr-sheet__grip" aria-hidden="true"></span>
    <p class="dr-sheet__title" id="sheet-avail-title">Availability</p>
    <div class="dr-picker__list">
      <button class="dr-picker__item" type="button" data-state="available"><span class="dr-picker__label">Available</span><svg class="dr-ic dr-ic--16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 6"/></svg></button>
      <button class="dr-picker__item" type="button" data-state="busy"><span class="dr-picker__label">Busy</span><svg class="dr-ic dr-ic--16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 6"/></svg></button>
      <button class="dr-picker__item" type="button" data-state="offline" aria-current="true"><span class="dr-picker__label">Offline</span><svg class="dr-ic dr-ic--16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 6"/></svg></button>
    </div>
    <button class="dr-btn dr-btn--secondary dr-btn--block" type="button" data-close>Cancel</button>
  </section>
</div>
<a class="wf-twin" href="../operator-listings-empty.html">Phone view</a>
<!-- the badge follows the select: the word is read off the tapped option's own label (the phone's script) -->
<script>
(function () {
  'use strict';
  var badge = document.querySelector('[data-avail-badge]');
  var word  = document.querySelector('[data-avail-word]');
  if (!badge || !word) return;
  var items = document.querySelectorAll('#sheet-avail .dr-picker__item');
  if (!items.length) return;
  function sync(item) {
    badge.setAttribute('data-state', item.getAttribute('data-state'));
    word.textContent = item.querySelector('.dr-picker__label').textContent.trim();
  }
  items.forEach(function (item) {
    item.addEventListener('click', function () { sync(item); });
  });
  var current = document.querySelector('#sheet-avail .dr-picker__item[aria-current="true"]');
  if (current) sync(current);
}());
</script>
<script src="../../ui/kit.js"></script>
</body>
</html>
