<!doctype html>
<html lang="en" data-wf-viewport="desktop">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DRON desktop · Withdraw to card / bank account · success (base)</title>
<meta name="description" content="Desktop twin of wireframes/withdraw.html.">
<!-- DESKTOP TWIN of ../withdraw.html (2026-10-18), group 7.  -->
<link rel="stylesheet" href="../../design-system/index.css">
<link rel="stylesheet" href="_desktop.css">
<link rel="stylesheet" href="_desktop-op-money.css">
</head>
<body class="dr">
<div class="wf-frame dr dr-screen dr-screen--fluid dk">
  <div class="dr-mapground" role="img" aria-label="Live map of Kyiv, 128 drones in the air"><span class="dr-mapground__drone" style="left:31%;top:34%"></span><span class="dr-mapground__drone" style="left:44%;top:58%"></span><span class="dr-mapground__drone" style="left:63%;top:30%"></span><span class="dr-mapground__drone" style="left:70%;top:66%"></span><span class="dr-mapground__drone" style="left:60%;top:82%"></span><span class="dr-mapground__drone" style="left:38%;top:76%"></span><span class="dr-mapground__drone" style="left:78%;top:44%"></span><span class="dr-mapground__drone" style="left:24%;top:60%"></span><span class="dr-mapground__drone" style="left:58%;top:48%"></span></div>
  <div class="dk-veil" aria-hidden="true"></div>
  <header class="dr-whead">
    <span class="dr-brand" role="img" aria-label="DRON"></span>
    <nav class="dr-whead__nav dr-material" aria-label="Primary">
      <a class="dr-whead__link" href="operator-listings.html">Jobs</a>
      <a class="dr-whead__link" href="wallet.html" aria-current="page">Earnings</a>
      <a class="dr-whead__link" href="ratings.html">Ratings</a>
      <a class="dr-whead__link" href="operator-account.html">Account</a>
    </nav>
    <div class="dr-whead__end">
      <button class="dr-iconbtn dr-material" type="button" data-theme-cycle aria-label="Switch the theme"><svg class="dr-ic dr-iconbtn__moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19.5 14.5A8 8 0 0 1 9.5 4.5a8 8 0 1 0 10 10z"/></svg><svg class="dr-ic dr-iconbtn__sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M5.6 18.4L7 17M17 7l1.4-1.4"/></svg></button>
      <a class="dr-iconbtn dr-material" href="operator-notifications.html" aria-label="Notifications, 3 unread"><svg class="dr-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 16V11a6 6 0 0 1 12 0v5l1.5 2h-15z"/><path d="M10 20a2 2 0 0 0 4 0"/></svg><span class="dr-count-badge" aria-hidden="true">3</span></a>
      <a class="dr-profilechip dr-material" href="operator-account.html"><img src="../../assets/people/thumbs/person-operator-ivan.png" alt=""><span class="dr-profilechip__text">Ivan K.<span class="dr-profilechip__place">Operator · Kyiv</span></span></a>
    </div>
  </header>
  <div class="dk-dim" aria-hidden="true"></div>
  <main class="dk-window dr-material" aria-labelledby="dk-title">
    <div class="dk-window__head"><a class="dr-iconbtn dr-material" href="wallet.html" aria-label="Back to Earnings"><svg class="dr-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></a><h1 class="dk-window__title" id="dk-title">Withdraw</h1></div>
    <h2 class="dr-label">Available</h2>
    <section class="dr-balance" aria-label="Available balance">
      <p class="dr-number">&#8372;3,240</p>
      <p class="dr-note dr-note--flush" id="wd-available">Available to withdraw</p>
    </section>
    <h2 class="dr-label">Amount</h2>
    <section aria-label="Amount">
      <div class="dr-rows dr-rows--card">
        <div class="dr-field">
          <label class="dr-field__label" for="wd-amount">Amount</label>
          <span class="dr-field__group"><input class="dr-field__input" id="wd-amount" name="amount" type="text" inputmode="numeric" value="&#8372;1,500" aria-describedby="wd-available"></span>
        </div>
      </div>
    </section>
    <h2 class="dr-label">Withdrawal method</h2>
    <section aria-label="Withdrawal method">
      <ul class="dr-picks">
        <li><label class="dr-pick">
          <span class="dr-box dr-box--radio" aria-hidden="true"><i class="dr-box__dot"></i></span>
          <span class="dr-pick__label">Instant to card &bull;&bull;&bull;&bull; 3318<span class="dr-pick__sub">Arrives in under a minute</span></span>
          <input type="radio" name="payout" class="sr-only" checked>
        </label></li>
        <li><label class="dr-pick">
          <span class="dr-box dr-box--radio" aria-hidden="true"><i class="dr-box__dot"></i></span>
          <span class="dr-pick__label">Bank transfer<span class="dr-pick__sub">1&ndash;3 business days</span></span>
          <input type="radio" name="payout" class="sr-only">
        </label></li>
      </ul>
    </section>
    <a class="dr-btn dr-btn--primary dr-btn--block" href="withdraw-loading.html">Withdraw &#8372;1,500</a>
  </main>
</div>
<a class="wf-twin" href="../withdraw.html">Phone view</a>
<script src="../../ui/kit.js"></script>
</body>
</html>
