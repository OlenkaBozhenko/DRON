<!doctype html>
<html lang="en" data-wf-viewport="desktop">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DRON desktop · Verification / document upload · error</title>
<meta name="description" content="Desktop twin of wireframes/operator-verification-error.html.">
<!-- DESKTOP TWIN of ../operator-verification-error.html (2026-10-18), group 6 · Operator: getting in and jobs.
     Signed-out step: a centred window over the map, the header holds the brand and the theme only. State: error, documents rejected. -->
<link rel="stylesheet" href="../../design-system/index.css">
<link rel="stylesheet" href="_desktop.css">
<link rel="stylesheet" href="_desktop-op-jobs.css">
</head>
<body class="dr">
<div class="wf-frame dr dr-screen dr-screen--fluid dk">
  <div class="dr-mapground" role="img" aria-label="Live map of Kyiv, 128 drones in the air"><span class="dr-mapground__drone" style="left:31%;top:34%"></span><span class="dr-mapground__drone" style="left:44%;top:58%"></span><span class="dr-mapground__drone" style="left:63%;top:30%"></span><span class="dr-mapground__drone" style="left:70%;top:66%"></span><span class="dr-mapground__drone" style="left:60%;top:82%"></span><span class="dr-mapground__drone" style="left:38%;top:76%"></span><span class="dr-mapground__drone" style="left:78%;top:44%"></span><span class="dr-mapground__drone" style="left:24%;top:60%"></span><span class="dr-mapground__drone" style="left:58%;top:48%"></span></div>
  <div class="dk-veil" aria-hidden="true"></div>
  <header class="dr-whead">
    <span class="dr-brand" role="img" aria-label="DRON"></span>
    <div class="dr-whead__end">
      <button class="dr-iconbtn dr-material" type="button" data-theme-cycle aria-label="Switch the theme"><svg class="dr-ic dr-iconbtn__moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19.5 14.5A8 8 0 0 1 9.5 4.5a8 8 0 1 0 10 10z"/></svg><svg class="dr-ic dr-iconbtn__sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M5.6 18.4L7 17M17 7l1.4-1.4"/></svg></button>
    </div>
  </header>
  <div class="dk-dim" aria-hidden="true"></div>
  <main class="dk-window dr-material" aria-labelledby="win-title">
    <div class="dk-window__head"><a class="dr-iconbtn dr-material" href="operator-signup.html" aria-label="Back to Sign in"><svg class="dr-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></a><h1 class="dk-window__title" id="win-title">Verification</h1></div>
    <section aria-label="Verification">
      <div class="dr-msg" role="alert">
        <span class="dr-mark dr-mark--danger" aria-hidden="true"><svg class="dr-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.8L2.6 20h18.8z"/><path d="M12 10v4.2"/><circle cx="12" cy="17.4" r=".9" fill="currentColor" stroke="none"/></svg></span>
        <span class="dr-msg__title">Documents were rejected</span>
        <p class="dr-msg__body">Insurance document is expired. Add a current policy that covers commercial drone operation, then submit again.</p>
      </div>
    </section>
    <div class="dk-acts">
      <a class="dr-btn dr-btn--primary dr-btn--block" href="operator-verification.html">Add document again</a>
      <a class="dr-btn dr-btn--secondary dr-btn--block" href="contact-support.html">Contact support</a>
    </div>
  </main>
</div>
<a class="wf-twin" href="../operator-verification-error.html">Phone view</a>
<script src="../../ui/kit.js"></script>
</body>
</html>
