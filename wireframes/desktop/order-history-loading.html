<!doctype html>
<html lang="en" data-wf-viewport="desktop">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DRON desktop · Order history · loading</title>
<meta name="description" content="Desktop twin of wireframes/order-history-loading.html.">
<!-- DESKTOP TWIN of ../order-history-loading.html (2026-10-18). Activity while the orders load: the phone's skeleton cards in the panel. -->
<link rel="stylesheet" href="../../design-system/index.css">
<link rel="stylesheet" href="_desktop.css">
<link rel="stylesheet" href="_desktop-outcome.css">
</head>
<body class="dr">
<div class="wf-frame dr dr-screen dr-screen--fluid dk">
  <div class="dr-mapground" role="img" aria-label="Live map of Kyiv, 128 drones in the air"><span class="dr-mapground__drone" style="left:31%;top:34%"></span><span class="dr-mapground__drone" style="left:44%;top:58%"></span><span class="dr-mapground__drone" style="left:63%;top:30%"></span><span class="dr-mapground__drone" style="left:70%;top:66%"></span><span class="dr-mapground__drone" style="left:60%;top:82%"></span><span class="dr-mapground__drone" style="left:38%;top:76%"></span><span class="dr-mapground__drone" style="left:78%;top:44%"></span><span class="dr-mapground__drone" style="left:24%;top:60%"></span><span class="dr-mapground__drone" style="left:58%;top:48%"></span></div>
  <div class="dk-veil" aria-hidden="true"></div>
  <header class="dr-whead">
    <span class="dr-brand" role="img" aria-label="DRON"></span>
    <nav class="dr-whead__nav dr-material" aria-label="Primary">
      <a class="dr-whead__link" href="listings.html">Overview</a>
      <a class="dr-whead__link" href="order-history.html" aria-current="page">Activity</a>
      <a class="dr-whead__link" href="support.html">Help</a>
      <a class="dr-whead__link" href="account.html">Account</a>
    </nav>
    <div class="dr-whead__end">
      <a class="dr-btn dr-btn--primary" href="listings-map.html">Order</a>
      <a class="dr-iconbtn dr-material" href="listings-filters.html" aria-label="Search and filters"><svg class="dr-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg></a>
      <button class="dr-iconbtn dr-material" type="button" data-theme-cycle aria-label="Switch the theme"><svg class="dr-ic dr-iconbtn__moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19.5 14.5A8 8 0 0 1 9.5 4.5a8 8 0 1 0 10 10z"/></svg><svg class="dr-ic dr-iconbtn__sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M5.6 18.4L7 17M17 7l1.4-1.4"/></svg></button>
      <a class="dr-iconbtn dr-material" href="notifications.html" aria-label="Notifications, 2 new"><svg class="dr-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 16V11a6 6 0 0 1 12 0v5l1.5 2h-15z"/><path d="M10 20a2 2 0 0 0 4 0"/></svg><span class="dr-count-badge">2</span></a>
      <a class="dr-profilechip dr-material" href="account.html"><img src="../../assets/people/thumbs/person-client-olena.png" alt=""><span class="dr-profilechip__text">Olena B.<span class="dr-profilechip__place">Kyiv · Podil</span></span></a>
    </div>
  </header>
  <main class="dk-panel dr-material">
    <h1 class="dk-panel__title">Activity</h1>
    <p class="dr-status-line" role="status">Loading your orders…</p>
    <section aria-label="Order history is loading">
        <ul class="dr-list" aria-hidden="true">
          <li>
            <div class="dr-card">
              <span class="dr-order__top">
                <span class="dr-sk-head"><span class="dr-sk-line dr-sk-title" style="width:62%"></span><span class="dr-sk-line dr-sk-date" style="width:40%"></span></span>
                <span class="dr-sk-well"></span>
              </span>
              <span class="dr-inset dr-inset--sk">
                <span class="dr-sk-route"></span>
              </span>
              <span class="dr-order__fee">
                <span class="dr-sk-money"><span class="dr-sk-line dr-sk-price"></span></span>
                <span class="dr-order__acts"><span class="dr-sk-btn"></span><span class="dr-sk-btn"></span></span>
              </span>
            </div>
          </li>
          <li class="dr-sk-d1">
            <div class="dr-card">
              <span class="dr-order__top">
                <span class="dr-sk-head"><span class="dr-sk-line dr-sk-title" style="width:50%"></span><span class="dr-sk-line dr-sk-date" style="width:34%"></span></span>
                <span class="dr-sk-well"></span>
              </span>
              <span class="dr-inset dr-inset--sk">
                <span class="dr-sk-route"></span>
              </span>
              <span class="dr-order__fee">
                <span class="dr-sk-money"><span class="dr-sk-line dr-sk-price" style="width:70px"></span></span>
                <span class="dr-order__acts"><span class="dr-sk-btn"></span><span class="dr-sk-btn"></span></span>
              </span>
            </div>
          </li>
          <li class="dr-sk-d2">
            <div class="dr-card">
              <span class="dr-order__top">
                <span class="dr-sk-head"><span class="dr-sk-line dr-sk-title" style="width:56%"></span><span class="dr-sk-line dr-sk-date" style="width:36%"></span></span>
                <span class="dr-sk-well"></span>
              </span>
              <span class="dr-inset dr-inset--sk">
                <span class="dr-sk-route"></span>
              </span>
              <span class="dr-order__fee">
                <span class="dr-sk-money"><span class="dr-sk-line dr-sk-price" style="width:78px"></span></span>
                <span class="dr-order__acts"><span class="dr-sk-btn"></span><span class="dr-sk-btn"></span></span>
              </span>
            </div>
          </li>
        </ul>
      </section>
  </main>
</div>
<a class="wf-twin" href="../order-history-loading.html">Phone view</a>
<script src="../../ui/kit.js"></script>
</body>
</html>
