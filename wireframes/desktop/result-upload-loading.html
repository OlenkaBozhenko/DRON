      </div>
    </section>
    <h2 class="dr-label">Notes</h2>
    <section aria-label="Handover notes">
      <div class="dr-rows">
        <div class="dr-field dr-field--area dr-field--area6">
          <textarea class="dr-field__input" placeholder="Handover notes, client name…" aria-label="Handover notes"></textarea>
        </div>
      </div>
    </section>
    <p class="dr-note" id="hold-terms">Payment is held until the client confirms — auto-confirms after 2h.</p>
    <a class="dr-btn dr-btn--primary dr-btn--block" href="wallet.html" aria-describedby="hold-terms">Uploading…</a>
