<!doctype html>
<meta charset="utf-8">
<title>tab row check</title>
<style>body{margin:0}iframe{width:375px;height:812px;border:0}</style>
<div id="w"></div>
<script>
var PAGES = ['operator-listings','operator-listings-empty','listings','listings-empty',
             'listings-error','listings-filtered','listings-loading',
             'time-slot','time-slot-empty','time-slot-inspection','time-slot-inspection-empty'];
PAGES.forEach(function(p){
  var f = document.createElement('iframe');
  f.dataset.p = p;
  f.src = 'wireframes/' + p + '.html?v=' + Date.now();
  document.getElementById('w').appendChild(f);
});
</script>
