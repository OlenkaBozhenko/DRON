<!doctype html>
<html><head><meta charset="utf-8"><title>measure</title></head>
<body>
<iframe id="f" src="/wireframes/wallet.html" style="width:1400px;height:1000px;border:0"></iframe>
<pre id="out">pending</pre>
<script>
function lum(c){
  var m = c.match(/\d+(\.\d+)?/g).map(Number);
  var f = m.slice(0,3).map(function(v){ v/=255; return v<=0.03928 ? v/12.92 : Math.pow((v+0.055)/1.055,2.4); });
  return 0.2126*f[0]+0.7152*f[1]+0.0722*f[2];
}
function ratio(a,b){ var l1=lum(a),l2=lum(b); var hi=Math.max(l1,l2),lo=Math.min(l1,l2); return (hi+0.05)/(lo+0.05); }
window.addEventListener('load', function(){
  setTimeout(function(){
    var d = document.getElementById('f').contentDocument;
    var out = {};
    var scr = d.querySelector('.dr-screen');
    var card = d.querySelector('.dr-balance--card');
    var fab = d.querySelector('.dr-fab');
    var num = d.querySelector('.dr-balance--card .dr-number');
    var note = d.querySelector('.dr-balance--card .dr-note');
    var glyph = d.querySelector('.dr-balance__glyph .dr-ic');
    var main = d.querySelector('.dr-main');
    var det = d.querySelector('.dr-card__actions .dr-btn');
    var tab = d.querySelector('.dr-tab[aria-current="page"]');
    var r = function(e){ var b=e.getBoundingClientRect(); return {w:+b.width.toFixed(2),h:+b.height.toFixed(2),x:+b.x.toFixed(2),y:+b.y.toFixed(2)}; };
    var cs = function(e){ return d.defaultView.getComputedStyle(e); };
    out.screen = r(scr);
    out.card = r(card);
    out.cardBg = cs(card).backgroundColor;
    out.cardRadius = cs(card).borderRadius;
    out.cardShadow = cs(card).boxShadow;
    out.fab = r(fab);
    out.fabBg = cs(fab).backgroundColor;
    out.fabRadius = cs(fab).borderRadius;
    out.fabShadow = cs(fab).boxShadow;
    out.fabMinH = cs(fab).minHeight;
    out.fabBottomGapToTabbar = +(d.querySelector('.dr-tabbar').getBoundingClientRect().top - fab.getBoundingClientRect().bottom).toFixed(2);
    out.numFont = cs(num).fontSize + '/' + cs(num).fontWeight + ' ' + cs(num).fontVariantNumeric;
    out.numColor = cs(num).color;
    out.noteFont = cs(note).fontSize;
    out.noteColor = cs(note).color;
    out.glyph = r(glyph);
    out.glyphStrokeRendered = +(1.7 * (glyph.getBoundingClientRect().width/24)).toFixed(2);
    out.mainPadBottom = cs(main).paddingBottom;
    out.mainScroll = { h: main.scrollHeight, client: main.clientHeight };
    out.detailsBtn = r(det);
    out.detailsBg = cs(det).backgroundColor;
    out.detailsColor = cs(det).color;
    out.tabBg = cs(tab).backgroundColor;
    // contrast
    out.ratios = {
      'number on card': +ratio(out.numColor, out.cardBg).toFixed(2),
      'note on card': +ratio(out.noteColor, out.cardBg).toFixed(2),
      'slate on green (rejected)': +ratio('rgb(90,87,81)', out.cardBg).toFixed(2),
      'green card on page': +ratio(out.cardBg, cs(d.querySelector('.dr-screen')).backgroundColor).toFixed(2),
      'details label on btn2': +ratio(out.detailsColor, out.detailsBg).toFixed(2),
      'fab label on green': +ratio(cs(fab).color, out.fabBg).toFixed(2)
    };
    // green coverage of the frame
    var frameArea = out.screen.w * out.screen.h;
    var greenArea = out.card.w*out.card.h + out.fab.w*out.fab.h;
    out.green = {
      frameArea: +frameArea.toFixed(0),
      cardArea: +(out.card.w*out.card.h).toFixed(0),
      fabArea: +(out.fab.w*out.fab.h).toFixed(0),
      totalGreen: +greenArea.toFixed(0),
      pctOfFrame: +(100*greenArea/frameArea).toFixed(2),
      ctaShareOfGreen: +(100*(out.fab.w*out.fab.h)/greenArea).toFixed(2),
      cardOnlyPct: +(100*(out.card.w*out.card.h)/frameArea).toFixed(2),
      fabOnlyPct: +(100*(out.fab.w*out.fab.h)/frameArea).toFixed(2)
    };
    document.getElementById('out').textContent = 'RESULT' + JSON.stringify(out, null, 1) + 'ENDRESULT';
  }, 900);
});
</script>
</body></html>
