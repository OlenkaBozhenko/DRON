<!doctype html>
<meta charset="utf-8">
<title>tab row — client vs operator</title>
<style>
  body{margin:0;background:#fff;font:13px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;color:#1A1A1A}
  .row{display:flex;gap:24px;padding:20px}
  .col{width:375px}
  h2{font-size:12px;margin:0 0 8px;letter-spacing:.04em;text-transform:uppercase;color:#6B6560}
  .shot{width:375px;height:430px;overflow:hidden;border:1px solid #D9D5CE;position:relative}
  iframe{width:375px;height:900px;border:0;position:absolute;top:0;left:0}
  pre{margin:0;padding:20px;font-size:12px}
</style>
<div class="row">
  <div class="col"><h2>listings — client</h2><div class="shot"><iframe id="a" src="/wireframes/listings.html"></iframe></div></div>
  <div class="col"><h2>operator-listings</h2><div class="shot"><iframe id="b" src="/wireframes/operator-listings.html"></iframe></div></div>
</div>
<pre id="out">pending</pre>
<script>
function strip(f){
  try{
    var d=f.contentDocument;
    d.body.classList.add('wf-hide-anno');
    var s=d.createElement('style');
    s.textContent='.wf-shell,.wf-tree,.wf-toolbar,aside,.legend{display:none!important}'
      +'body{margin:0!important;padding:0!important;background:#fff!important}'
      +'.wf-frame{margin:0!important;transform:none!important}';
    d.head.appendChild(s);
  }catch(e){}
}
function read(f,label){
  var d=f.contentDocument;
  var fr=d.querySelector('.wf-frame').getBoundingClientRect();
  var nav=d.querySelector('.dr-groups');
  var rel=function(e){var b=e.getBoundingClientRect();
    return {x:+(b.x-fr.x).toFixed(2),y:+(b.y-fr.y).toFixed(2),w:+b.width.toFixed(2),h:+b.height.toFixed(2)};};
  var tabs=[].slice.call(d.querySelectorAll('.dr-grouptab')).map(function(t){
    var r=d.createRange();r.selectNodeContents(t);
    return {text:t.textContent.trim(),box:rel(t),textW:+r.getBoundingClientRect().width.toFixed(2)};
  });
  var used=tabs.reduce(function(a,t){return a+t.box.w;},0);
  return {page:label,frameW:+fr.width.toFixed(2),
    parent:nav.parentElement.tagName.toLowerCase()+'.'+(nav.parentElement.className||'').split(' ')[0],
    nav:Object.assign(rel(nav),{clientW:nav.clientWidth,scrolls:nav.scrollWidth>nav.clientWidth+1}),
    trackUsed:+used.toFixed(2), trackFree:+(nav.clientWidth-8-used).toFixed(2), tabs:tabs};
}
window.addEventListener('load',function(){
  var a=document.getElementById('a'),b=document.getElementById('b');
  strip(a);strip(b);
  setTimeout(function(){
    document.getElementById('out').textContent=JSON.stringify([read(a,'listings (client)'),read(b,'operator-listings')],null,1);
  },600);
});
</script>
