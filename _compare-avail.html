<!doctype html>
<html><head><meta charset="utf-8"><title>Availability — segment vs select</title>
<style>
  body{margin:0;background:#fff;font:13px/1.3 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;color:#252525;}
  .grid{display:flex;gap:24px;padding:20px;align-items:flex-start;}
  .cell{width:375px;}
  .cap{font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:#909090;margin:0 0 8px;}
  .cap b{color:#252525;font-weight:600;}
  .win{width:375px;overflow:hidden;position:relative;border:1px solid rgba(0,0,0,.15);border-radius:8px;}
  .win iframe{position:absolute;left:-272px;top:-52px;border:0;}
</style></head>
<body>
<div class="grid">
  <div class="cell">
    <p class="cap"><b>Before</b> — segmented control</p>
    <div class="win" style="height:266px"><iframe id="a" src="/wireframes/operator-listings.html" width="1300" height="900"></iframe></div>
  </div>
  <div class="cell">
    <p class="cap"><b>After</b> — select row</p>
    <div class="win" style="height:266px"><iframe id="b" src="/wireframes/operator-listings.html" width="1300" height="900"></iframe></div>
  </div>
  <div class="cell">
    <p class="cap"><b>After</b> — the drawer it opens</p>
    <div class="win" style="height:812px"><iframe id="c" src="/wireframes/operator-listings.html" width="1300" height="900"></iframe></div>
  </div>
</div>
<script>
var OLD = '<form><fieldset class="dr-segment"><legend class="sr-only">Availability status</legend>' +
  '<label class="dr-segment__seg">Available<input type="radio" name="status" value="available" checked></label>' +
  '<label class="dr-segment__seg">Busy<input type="radio" name="status" value="busy"></label>' +
  '<label class="dr-segment__seg">Offline<input type="radio" name="status" value="offline"></label>' +
  '</fieldset></form>';
document.getElementById('a').addEventListener('load', function(){
  var d = this.contentDocument;
  d.querySelector('section[aria-label="Availability status"]').innerHTML = OLD;
});
document.getElementById('c').addEventListener('load', function(){
  var d = this.contentDocument;
  d.querySelector('.dr-field--action[aria-controls="sheet-avail"]').click();
});
</script>
</body></html>
