<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>DRON on a Mac · desktop preview</title>
<!-- PREVIEW, scaffolding (CLAUDE.md: compare pages and previews are not the product). The
     responsive/width-audit.md desktop shell drawn once: a sidebar instead of the tab bar, the
     search across the top, the options beside a large map. Components and tokens are DRON's;
     the layout CSS below is the part the system does not have yet. -->
<link rel="stylesheet" href="../design-system/index.css">
<style>
  body { margin:0; min-height:100vh; display:grid; place-items:center;
         background: radial-gradient(120% 90% at 20% 10%, #DDE8C8 0%, #C9D3BE 40%, #9AA593 100%); font-family: var(--font-ui); }
  .mac { width:1440px; height:900px; border-radius:12px; overflow:hidden; display:flex; flex-direction:column;
         background: var(--bg-page); box-shadow: 0 30px 80px rgba(26,26,26,.35), 0 0 0 1px rgba(26,26,26,.18); }
  .mac__bar { height:52px; flex:none; display:flex; align-items:center; gap:16px; padding:0 16px;
              background:#ECEAE6; border-bottom:1px solid #D9D5CE; }
  .mac__dots { display:flex; gap:8px; } .mac__dots i { width:12px; height:12px; border-radius:50%; display:block; }
  .mac__url { flex:1; max-width:560px; margin:0 auto; height:30px; border-radius:8px; background:#FFFFFF;
              display:flex; align-items:center; justify-content:center; gap:6px; font-size:13px; color:#5A5751; }
  .app { flex:1; min-height:0; display:grid; grid-template-columns: 232px 1fr; }
  .m-side { border-right:1px solid var(--border-hairline); padding:20px 14px; display:flex; flex-direction:column; gap:4px; background: var(--bg-page); }
  .m-side .dr-brand { margin:4px 10px 22px; }
  .m-nav { display:flex; align-items:center; gap:12px; padding:10px 12px; border-radius:12px; color: var(--text-primary);
           text-decoration:none; font-size: var(--type-heading-size); }
  .m-nav svg { width:22px; height:22px; flex:none; }
  .m-nav.is-on { background: var(--bg-accent-tint); font-weight: var(--type-weight-medium); }
  .m-side__me { margin-top:auto; display:flex; align-items:center; gap:10px; padding:10px 12px; font-size: var(--type-body-size); }
  .m-side__me img { width:36px; height:36px; border-radius:50%; object-fit:cover; }
  .m-main { min-width:0; display:flex; flex-direction:column; }
  .m-top { height:76px; flex:none; display:flex; align-items:center; gap:16px; padding:0 24px; border-bottom:1px solid var(--border-hairline); }
  .m-search { flex:1; max-width:760px; display:flex; align-items:stretch; height:52px; border-radius:999px; background: var(--bg-surface); padding:4px; }
  .m-search span { flex:1; display:flex; flex-direction:column; justify-content:center; padding:0 18px; border-right:1px solid var(--border-hairline); }
  .m-search span:nth-last-child(2) { border-right:0; }
  .m-search b { font-size: var(--type-caption-size); color: var(--text-muted); font-weight: var(--type-weight-medium); }
  .m-search em { font-style:normal; font-size: var(--type-body-size); color: var(--text-primary); }
  .m-search .dr-btn { border-radius:999px; padding:0 26px; }
  .m-top__end { margin-left:auto; display:flex; align-items:center; gap:14px; }
  .m-top__end svg { width:24px; height:24px; color: var(--text-primary); }
  .m-work { flex:1; min-height:0; display:grid; grid-template-columns: 420px 1fr; }
  .m-panel { padding:24px; overflow:auto; display:flex; flex-direction:column; gap:14px; border-right:1px solid var(--border-hairline); }
  .m-panel h1 { margin:0; font-size: var(--type-display-size); font-weight: var(--type-display-weight); }
  .m-panel p { margin:0; color: var(--text-muted); font-size: var(--type-body-size); }
  .m-panel .dr-btn { margin-top:auto; }
  .m-map { position:relative; background: url(../assets/map/live-map.jpg) center/cover; }
  .m-pin { position:absolute; transform:translate(-50%,-50%); padding:7px 12px; border-radius:999px; background: var(--bg-page);
           color: var(--text-primary); font-size: var(--type-body-sm-size); font-weight: var(--type-weight-medium);
           box-shadow: var(--shadow-raised); white-space:nowrap; }
  .m-pin.is-on { background: var(--color-action); color: var(--on-action); }
  .m-drone { position:absolute; left:38%; top:14%; width:150px; filter: drop-shadow(0 14px 18px rgba(26,26,26,.25)); }
  .m-zoom { position:absolute; right:18px; top:18px; display:flex; flex-direction:column; border-radius:12px; overflow:hidden; box-shadow: var(--shadow-raised); }
  .m-zoom b { width:40px; height:40px; display:grid; place-items:center; background: var(--bg-page); font-size:20px; font-weight:400; }
  .m-zoom b + b { border-top:1px solid var(--border-hairline); }
</style>
</head>
<body>
  <div class="mac">
    <div class="mac__bar">
      <span class="mac__dots"><i style="background:#FF5F57"></i><i style="background:#FEBC2E"></i><i style="background:#28C840"></i></span>
      <span class="mac__url">&#128274; dron.app</span>
    </div>
    <div class="app dr">
      <nav class="m-side" aria-label="Primary">
        <span class="dr-brand" role="img" aria-label="DRON"></span>
        <a class="m-nav is-on" href="#" aria-current="page"><svg class="dr-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="4" width="7" height="7" rx="1.6"/><rect x="13" y="4" width="7" height="7" rx="1.6"/><rect x="4" y="13" width="7" height="7" rx="1.6"/><rect x="13" y="13" width="7" height="7" rx="1.6"/></svg><span>Order</span></a><a class="m-nav" href="#"><svg class="dr-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6h11M9 12h11M9 18h11"/><circle cx="4.6" cy="6" r="1.1" fill="currentColor" stroke="none"/><circle cx="4.6" cy="12" r="1.1" fill="currentColor" stroke="none"/><circle cx="4.6" cy="18" r="1.1" fill="currentColor" stroke="none"/></svg><span>Activity</span></a><a class="m-nav" href="#"><svg class="dr-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M9.4 9.4a2.7 2.7 0 0 1 5.2 1c0 1.8-2.6 2.1-2.6 3.9"/><circle cx="12" cy="17" r=".9" fill="currentColor" stroke="none"/></svg><span>Help</span></a><a class="m-nav" href="#"><svg class="dr-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="3.4"/><path d="M5.5 20c0-3.4 2.9-5.8 6.5-5.8s6.5 2.4 6.5 5.8"/></svg><span>Account</span></a>
        <div class="m-side__me"><img src="../assets/people/thumbs/person-client-olena.png" alt=""><span>Olena B.</span></div>
      </nav>
      <div class="m-main">
        <header class="m-top">
          <div class="m-search" role="search">
            <span><b>Service</b><em>Package delivery</em></span>
            <span><b>When</b><em>Today · now</em></span>
            <span><b>Filters</b><em>Any drone · any price</em></span>
            <a class="dr-btn dr-btn--secondary" href="#">Find</a>
          </div>
          <div class="m-top__end"><svg class="dr-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3.4a5.9 5.9 0 0 0-5.9 5.9c0 4.1-1.5 5.3-1.5 5.3h14.8s-1.5-1.2-1.5-5.3A5.9 5.9 0 0 0 12 3.4Z"/><path d="M10.1 18a2.1 2.1 0 0 0 3.8 0"/></svg></div>
        </header>
        <div class="m-work">
          <section class="m-panel" aria-label="Options">
            <h1>Package delivery</h1>
            <p>Podil → Osokorky · 3 options near you</p>
            <fieldset class="dr-offers" aria-labelledby="offers-title">
          <label class="dr-offer">
            <input type="radio" name="offer" value="2kg" checked class="sr-only">
            <span class="dr-well"><img src="../assets/drones/thumbs/drone-02.png" alt="" loading="lazy" decoding="async"></span>
            <span class="dr-offer__body">
              <span class="dr-offer__name">Up to 2 kg</span>
              <span class="dr-offer__meta">4 available · arrives in 6 min</span>
            </span>
            <span class="dr-offer__price">₴180</span>
          </label>
          <label class="dr-offer">
            <input type="radio" name="offer" value="5kg" class="sr-only">
            <span class="dr-well"><img src="../assets/drones/thumbs/drone-01.png" alt="" loading="lazy" decoding="async"></span>
            <span class="dr-offer__body">
              <span class="dr-offer__name">Up to 5 kg</span>
              <span class="dr-offer__meta">2 available · arrives in 9 min</span>
            </span>
            <span class="dr-offer__price">₴240</span>
          </label>
          <label class="dr-offer">
            <input type="radio" name="offer" value="10kg" class="sr-only">
            <span class="dr-well"><img src="../assets/drones/thumbs/drone-08.png" alt="" loading="lazy" decoding="async"></span>
            <span class="dr-offer__body">
              <span class="dr-offer__name">Up to 10 kg</span>
              <span class="dr-offer__meta">1 available · arrives in 14 min</span>
            </span>
            <span class="dr-offer__price">₴320</span>
          </label>
        </fieldset>
            <a class="dr-btn dr-btn--primary dr-btn--block" href="#">Order · &#8372;180</a>
          </section>
          <div class="m-map" role="img" aria-label="Map of drones near you">
            <img class="m-drone" src="../assets/drones/thumbs/drone-02.png" alt="">
            <span class="m-pin is-on" style="left:44%;top:30%">₴180 · 6 min</span><span class="m-pin" style="left:62%;top:52%">₴240 · 9 min</span><span class="m-pin" style="left:30%;top:64%">₴180 · 8 min</span><span class="m-pin" style="left:73%;top:24%">₴320 · 14 min</span><span class="m-pin" style="left:55%;top:75%">₴180 · 11 min</span>
            <span class="m-zoom"><b>+</b><b>&minus;</b></span>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
