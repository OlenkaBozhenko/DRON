<!doctype html>
<html><head><meta charset="utf-8"><title>tmp measure</title></head>
<body>
<iframe id="f" src="/wireframes/contact-support.html" style="width:1400px;height:1000px;border:0"></iframe>
<pre id="out">pending</pre>
<script>
function px(n){ return Math.round(n*100)/100; }
function snap(d, tag, out){
  var bar = d.querySelector('.dr-actionbar');
  var main = d.querySelector('.dr-main');
  out.push('--- ' + tag + ' ---');
  out.push('main box ' + px(main.getBoundingClientRect().height) +
    ' | content ' + main.scrollHeight +
    ' | ' + (main.scrollHeight > main.clientHeight ? 'SCROLLS by ' + (main.scrollHeight - main.clientHeight) : 'fits'));
  out.push('actionbar ' + px(bar.getBoundingClientRect().height));
  var btns = bar.querySelectorAll('.dr-btn');
  for (var i=0;i<btns.length;i++){
    var r = btns[i].getBoundingClientRect();
    out.push('  bar btn "' + btns[i].textContent.trim() + '" ' + px(r.width) + ' x ' + px(r.height));
  }
  var inForm = d.querySelectorAll('form[aria-label="Message support"] .dr-btn');
  for (var i=0;i<inForm.length;i++){
    var r = inForm[i].getBoundingClientRect();
    out.push('  form btn "' + inForm[i].textContent.trim() + '" ' + px(r.width) + ' x ' + px(r.height));
  }
  var ta = d.querySelector('#ms');
  out.push('  textarea ' + px(ta.getBoundingClientRect().width) + ' x ' + px(ta.getBoundingClientRect().height));
}
window.addEventListener('load', function(){
  setTimeout(function(){
    var d = document.getElementById('f').contentDocument;
    var out = [];
    var frame = d.querySelector('.wf-frame').getBoundingClientRect();
    out.push('frame ' + px(frame.width) + ' x ' + px(frame.height));
    snap(d, 'AFTER (built: button in the action bar)', out);

    // rebuild the previous arrangement in memory only — no file is touched
    var call = null, bar = d.querySelector('.dr-actionbar');
    bar.querySelectorAll('.dr-btn').forEach(function(b){ if (b.textContent.trim() === 'Call support') call = b; });
    d.querySelector('form[aria-label="Message support"]').appendChild(call);
    snap(d, 'BEFORE (button inside the form)', out);

    document.getElementById('out').textContent = out.join('\n');
  }, 600);
});
</script>
</body></html>
