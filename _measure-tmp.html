<!doctype html>
<html><head><meta charset="utf-8"><title>glyph proof</title>
<style>
 body{margin:0;background:#F7F5F2;font:14px -apple-system,system-ui,sans-serif;color:#5A5751}
 .row{display:flex;gap:28px;align-items:flex-end;padding:28px}
 .well{background:#E4E1DA;border-radius:13px;display:flex;align-items:center;justify-content:center;color:#5A5751}
 .w52{width:52px;height:52px}.w130{width:130px;height:130px;border-radius:32px}
 .w52 svg{width:26px;height:26px}.w130 svg{width:65px;height:65px}
 .warn{background:#F6E7C4;color:#7A5200}
 .cap{font-size:11px;text-align:center;margin-top:8px}
</style></head>
<body>
<div class="row">
 <div><div class="well w52"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.8L2.6 20h18.8z"/><path d="M12 10v4.2"/><circle cx="12" cy="17.4" r=".9" fill="currentColor" stroke="none"/></svg></div><div class="cap">neutral 26px</div></div>
 <div><div class="well w130"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.8L2.6 20h18.8z"/><path d="M12 10v4.2"/><circle cx="12" cy="17.4" r=".9" fill="currentColor" stroke="none"/></svg></div><div class="cap">neutral 2.5x</div></div>
 <div><div class="well w52 warn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.8L2.6 20h18.8z"/><path d="M12 10v4.2"/><circle cx="12" cy="17.4" r=".9" fill="currentColor" stroke="none"/></svg></div><div class="cap">warn 26px</div></div>
 <div><div class="well w130 warn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.8L2.6 20h18.8z"/><path d="M12 10v4.2"/><circle cx="12" cy="17.4" r=".9" fill="currentColor" stroke="none"/></svg></div><div class="cap">warn 2.5x</div></div>
</div>
</body></html>
